name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "nightly"
        type: choice
        options:
          - stable
          - nightly

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin lingxi-t3-native

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh "${GITHUB_REF_NAME:-0.1.0-nightly}"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh "${GITHUB_REF_NAME:-0.1.0-nightly}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Version "${env:GITHUB_REF_NAME}" -Arch "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
