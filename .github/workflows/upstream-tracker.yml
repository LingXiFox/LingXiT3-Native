name: Upstream Feature Tracker

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Audit Upstream T3 Code Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run upstream sync audit
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python3 scripts/upstream_sync_audit.py --out "docs/upstream/sync-$DATE.md"

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(upstream): add weekly T3 Code porting audit"
          title: "chore(upstream): T3 Code upstream feature tracking audit"
          body: "Automated Rust porting audit generated from pingdotgg/t3code and LingXiFox/t3code."
          branch: chore/upstream-audit
